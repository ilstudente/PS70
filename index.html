<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Ettel - PS70</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #87CEEB;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            cursor: none;
        }

        /* Alpine landscape background */
        .sky {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 70%, #FFF5E6 100%);
            z-index: 0;
        }

        .clouds {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 100px;
            opacity: 0.8;
            animation: float 60s infinite linear;
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 100px;
        }

        .cloud1 {
            width: 100px;
            height: 40px;
            top: 10%;
            left: -10%;
            animation-duration: 80s;
        }

        .cloud1::before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 10px;
        }

        .cloud1::after {
            width: 60px;
            height: 40px;
            top: -15px;
            right: 10px;
        }

        .cloud2 {
            width: 120px;
            height: 50px;
            top: 20%;
            left: -15%;
            animation-duration: 100s;
        }

        .cloud2::before {
            width: 60px;
            height: 60px;
            top: -30px;
            left: 20px;
        }

        .cloud2::after {
            width: 70px;
            height: 50px;
            top: -20px;
            right: 15px;
        }

        .cloud3 {
            width: 80px;
            height: 35px;
            top: 30%;
            left: -20%;
            animation-duration: 70s;
        }

        .cloud3::before {
            width: 40px;
            height: 40px;
            top: -20px;
            left: 15px;
        }

        .cloud3::after {
            width: 50px;
            height: 35px;
            top: -15px;
            right: 10px;
        }

        @keyframes float {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(calc(100vw + 200px));
            }
        }

        /* Mountains */
        .mountains {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 70%;
            z-index: 2;
        }

        .mountain {
            position: absolute;
            bottom: 0;
            width: 0;
            height: 0;
            border-style: solid;
        }

        .mountain-back {
            border-width: 0 300px 450px 300px;
            border-color: transparent transparent #8B7355 transparent;
            left: 5%;
            filter: brightness(0.75);
        }

        .mountain-mid {
            border-width: 0 350px 550px 350px;
            border-color: transparent transparent #A0826D transparent;
            left: 25%;
            filter: brightness(0.85);
        }

        .mountain-front {
            border-width: 0 400px 600px 400px;
            border-color: transparent transparent #6B8E23 transparent;
            right: 15%;
        }

        /* Snow caps */
        .snow-cap {
            position: absolute;
            width: 0;
            height: 0;
            border-style: solid;
        }

        .snow-cap-1 {
            border-width: 0 180px 180px 180px;
            border-color: transparent transparent white transparent;
            left: 5%;
            bottom: 450px;
        }

        .snow-cap-2 {
            border-width: 0 210px 210px 210px;
            border-color: transparent transparent white transparent;
            left: 25%;
            bottom: 550px;
        }

        .snow-cap-3 {
            border-width: 0 240px 240px 240px;
            border-color: transparent transparent white transparent;
            right: 15%;
            bottom: 600px;
        }

        /* Sun */
        .sun {
            position: fixed;
            top: 80px;
            right: 100px;
            width: 80px;
            height: 80px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 60px #FFD700;
            z-index: 1;
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.9;
            }
        }

        /* Cat cursor follower */
        .cat-cursor {
            position: fixed;
            width: 50px;
            height: 50px;
            pointer-events: none;
            z-index: 10000;
            transition: transform 0.1s ease;
            font-size: 40px;
            transform: translate(-50%, -50%);
        }

        header {
            position: relative;
            text-align: center;
            color: white;
            padding: 40px 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            z-index: 3;
        }

        h1 {
            font-size: 3.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        h2 {
            font-size: 1.8em;
            font-weight: 400;
            opacity: 0.95;
        }

        /* Animal positioning */
        .animal {
            position: fixed;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 5;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
        }

        .animal:hover {
            transform: scale(1.15) translateY(-10px);
            filter: drop-shadow(4px 4px 8px rgba(0,0,0,0.4));
            z-index: 100;
        }

        .animal svg {
            width: 100%;
            height: 100%;
        }

        .animal .tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            margin-bottom: 10px;
        }

        .animal:hover .tooltip {
            opacity: 1;
        }

        /* Specific animal positions and sizes */
        .cow { bottom: 15%; left: 8%; width: 100px; height: 80px; }
        .steinbock { bottom: 55%; right: 25%; width: 90px; height: 85px; }
        .marmot { bottom: 48%; left: 32%; width: 70px; height: 60px; }
        .deer { bottom: 25%; left: 28%; width: 95px; height: 90px; }
        .fox { bottom: 12%; left: 45%; width: 75px; height: 65px; }
        .rabbit { bottom: 20%; right: 50%; width: 60px; height: 55px; }
        .goat { bottom: 35%; right: 12%; width: 85px; height: 75px; }
        .sheep { bottom: 18%; right: 35%; width: 80px; height: 70px; }
        .bird { bottom: 42%; left: 12%; width: 60px; height: 55px; }
        .chamois { bottom: 50%; left: 18%; width: 85px; height: 80px; }
        .snake { bottom: 8%; right: 20%; width: 90px; height: 40px; }
        .eagle { top: 25%; right: 15%; width: 110px; height: 90px; animation: soar 8s ease-in-out infinite; }

        @keyframes soar {
            0%, 100% {
                transform: translateY(0) translateX(0);
            }
            50% {
                transform: translateY(-20px) translateX(10px);
            }
        }

        @media (max-width: 1024px) {
            h1 { font-size: 2.5em; }
            h2 { font-size: 1.3em; }
            .animal { transform: scale(0.8); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2em; }
            h2 { font-size: 1.1em; }
            .animal { transform: scale(0.6); }
        }
    </style>
</head>

    <script>
        // Cat cursor follower
        const cat = document.querySelector('.cat-cursor');
        let mouseX = 0;
        let mouseY = 0;
        let catX = 0;
        let catY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateCat() {
            const dx = mouseX - catX;
            const dy = mouseY - catY;

            catX += dx * 0.1;
            catY += dy * 0.1;

            cat.style.left = catX + 'px';
            cat.style.top = catY + 'px';

            if (dx > 1) {
                cat.style.transform = 'translate(-50%, -50%) scaleX(1)';
            } else if (dx < -1) {
                cat.style.transform = 'translate(-50%, -50%) scaleX(-1)';
            }

            requestAnimationFrame(animateCat);
        }

        animateCat();
    </script>
