    <script>
        const canvas = document.getElementById('gameOfLife');
        const ctx = canvas.getContext('2d');

        let width, height, cellSize, cols, rows;
        let grid, nextGrid;
        let hue = 45; // Starting hue (golden)
        let zoom = 1;
        const minZoom = 0.5;
        const maxZoom = 3;

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cellSize = Math.floor(10 * zoom);
            cols = Math.floor(width / cellSize);
            rows = Math.floor(height / cellSize);

            grid = createGrid();
            nextGrid = createGrid();
            randomizeGrid();
        }

        function createGrid() {
            return new Array(cols).fill(null).map(() => new Array(rows).fill(0));
        }

        function randomizeGrid() {
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    grid[i][j] = Math.random() > 0.7 ? 1 : 0;
                }
            }
        }

        function countNeighbors(x, y) {
            let count = 0;
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    const col = (x + i + cols) % cols;
                    const row = (y + j + rows) % rows;
                    count += grid[col][row];
                }
            }
            return count;
        }

        function updateGrid() {
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    const neighbors = countNeighbors(i, j);
                    const current = grid[i][j];

                    if (current === 1 && (neighbors < 2 || neighbors > 3)) {
                        nextGrid[i][j] = 0;
                    } else if (current === 0 && neighbors === 3) {
                        nextGrid[i][j] = 1;
                    } else {
                        nextGrid[i][j] = current;
                    }
                }
            }
            [grid, nextGrid] = [nextGrid, grid];
        }

        function drawGrid() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            // Gradually change hue over time (faster)
            hue = (hue + 1) % 360;

            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    if (grid[i][j] === 1) {
                        // Create gradient by varying hue based on position
                        const cellHue = (hue + (i + j) * 2) % 360;
                        ctx.fillStyle = `hsl(${cellHue}, 70%, 50%)`;
                        ctx.fillRect(i * cellSize, j * cellSize, cellSize - 1, cellSize - 1);
                    }
                }
            }
        }

        function handleZoom(delta) {
            const oldZoom = zoom;
            zoom *= delta > 0 ? 1.1 : 0.9;
            zoom = Math.max(minZoom, Math.min(maxZoom, zoom));

            if (oldZoom !== zoom) {
                const oldCellSize = cellSize;
                cellSize = Math.floor(10 * zoom);
                const newCols = Math.floor(width / cellSize);
                const newRows = Math.floor(height / cellSize);

                if (newCols !== cols || newRows !== rows) {
                    const oldGrid = grid;
                    cols = newCols;
                    rows = newRows;
                    grid = createGrid();
                    nextGrid = createGrid();

                    // Copy old grid to new grid
                    for (let i = 0; i < Math.min(oldGrid.length, cols); i++) {
                        for (let j = 0; j < Math.min(oldGrid[0].length, rows); j++) {
                            grid[i][j] = oldGrid[i][j];
                        }
                    }
                }
            }
        }

        function animate() {
            updateGrid();
            drawGrid();
            setTimeout(() => requestAnimationFrame(animate), 100);
        }

        initCanvas();
        animate();

        // Zoom with mouse wheel
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            handleZoom(e.deltaY);
        }, { passive: false });

        // Zoom with touch gestures
        let lastTouchDistance = 0;
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                lastTouchDistance = Math.sqrt(dx * dx + dy * dy);
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (lastTouchDistance > 0) {
                    const delta = distance - lastTouchDistance;
                    handleZoom(delta);
                }
                lastTouchDistance = distance;
            }
        }, { passive: false });

        window.addEventListener('resize', initCanvas);
    </script>
