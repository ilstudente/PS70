<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - David Ettel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            letter-spacing: 0.5px;
            line-height: 1.8;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        .back-link {
            color: #666;
            text-decoration: none;
            font-size: 0.9em;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            display: inline-block;
            margin-bottom: 60px;
        }

        .back-link:hover {
            color: #d4af37;
        }

        h1 {
            font-size: 2.5em;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 40px;
            color: #fff;
            border-bottom: 1px solid #333;
            padding-bottom: 30px;
        }

        .content {
            color: #ccc;
            font-size: 1.05em;
            font-weight: 300;
        }

        .content p {
            margin-bottom: 25px;
        }

        .content strong {
            color: #d4af37;
            font-weight: 400;
        }

        .divider {
            height: 1px;
            background: #222;
            margin: 50px 0;
        }

        .contact {
            margin-top: 50px;
        }

        .contact h2 {
            font-size: 1.2em;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 20px;
            color: #999;
        }

        .contact a {
            color: #d4af37;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .contact a:hover {
            color: #fff;
        }

        #gameOfLife {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .content {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameOfLife"></canvas>
    <div class="container">
        <a href="index.html" class="back-link">← Back</a>

        <h1>About</h1>

        <div class="content">
        </div>
            <p>Hello! I'm <strong>David Ettel</strong>, a senior at Harvard studying pure math, computer science, and anything that seems like ann exciting challenge.</p>

            <p>When I'm not thinking, you can probably find me on a mountain, a soccer field or on some kind of adventure.</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameOfLife');
        const ctx = canvas.getContext('2d');

        let width, height, cellSize, cols, rows;
        let grid, nextGrid;

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cellSize = 10;
            cols = Math.floor(width / cellSize);
            rows = Math.floor(height / cellSize);

            grid = createGrid();
            nextGrid = createGrid();
            randomizeGrid();
        }

        function createGrid() {
            return new Array(cols).fill(null).map(() => new Array(rows).fill(0));
        }

        function randomizeGrid() {
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    grid[i][j] = Math.random() > 0.7 ? 1 : 0;
                }
            }
        }

        function countNeighbors(x, y) {
            let count = 0;
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    const col = (x + i + cols) % cols;
                    const row = (y + j + rows) % rows;
                    count += grid[col][row];
                }
            }
            return count;
        }

        function updateGrid() {
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    const neighbors = countNeighbors(i, j);
                    const current = grid[i][j];

                    if (current === 1 && (neighbors < 2 || neighbors > 3)) {
                        nextGrid[i][j] = 0;
                    } else if (current === 0 && neighbors === 3) {
                        nextGrid[i][j] = 1;
                    } else {
                        nextGrid[i][j] = current;
                    }
                }
            }
            [grid, nextGrid] = [nextGrid, grid];
        }

        function drawGrid() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#d4af37';
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    if (grid[i][j] === 1) {
                        ctx.fillRect(i * cellSize, j * cellSize, cellSize - 1, cellSize - 1);
                    }
                }
            }
        }

        function animate() {
            updateGrid();
            drawGrid();
            setTimeout(() => requestAnimationFrame(animate), 100);
        }

        initCanvas();
        animate();

        window.addEventListener('resize', initCanvas);
    </script>
</body>
</html>
