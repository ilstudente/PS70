    <script>
        const canvas = document.getElementById('gameOfLife');
        const ctx = canvas.getContext('2d');
        let width, height, cellSize, cols, rows, grid, nextGrid;
        function initCanvas() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; cellSize = 10; cols = Math.floor(width / cellSize); rows = Math.floor(height / cellSize); grid = createGrid(); nextGrid = createGrid(); randomizeGrid(); }
        function createGrid() { return new Array(cols).fill(null).map(() => new Array(rows).fill(0)); }
        function randomizeGrid() { for (let i = 0; i < cols; i++) { for (let j = 0; j < rows; j++) { grid[i][j] = Math.random() > 0.7 ? 1 : 0; } } }
        function countNeighbors(x, y) { let count = 0; for (let i = -1; i <= 1; i++) { for (let j = -1; j <= 1; j++) { if (i === 0 && j === 0) continue; const col = (x + i + cols) % cols; const row = (y + j + rows) % rows; count += grid[col][row]; } } return count; }
        function updateGrid() { for (let i = 0; i < cols; i++) { for (let j = 0; j < rows; j++) { const neighbors = countNeighbors(i, j); const current = grid[i][j]; if (current === 1 && (neighbors < 2 || neighbors > 3)) { nextGrid[i][j] = 0; } else if (current === 0 && neighbors === 3) { nextGrid[i][j] = 1; } else { nextGrid[i][j] = current; } } } [grid, nextGrid] = [nextGrid, grid]; }
        function drawGrid() { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, width, height); ctx.fillStyle = '#d4af37'; for (let i = 0; i < cols; i++) { for (let j = 0; j < rows; j++) { if (grid[i][j] === 1) { ctx.fillRect(i * cellSize, j * cellSize, cellSize - 1, cellSize - 1); } } } }
        function animate() { updateGrid(); drawGrid(); setTimeout(() => requestAnimationFrame(animate), 100); }
        initCanvas(); animate(); window.addEventListener('resize', initCanvas);
    </script>
