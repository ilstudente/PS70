<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Networking - PS70</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            padding: 60px 20px;
            letter-spacing: 0.5px;
            line-height: 1.8;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .back-link {
            color: #666;
            text-decoration: none;
            font-size: 0.9em;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            display: inline-block;
            margin-bottom: 60px;
        }

        .back-link:hover {
            color: #d4af37;
        }

        .header {
            border-bottom: 1px solid #333;
            padding-bottom: 40px;
            margin-bottom: 60px;
        }

        .week-number {
            color: #666;
            font-size: 0.85em;
            letter-spacing: 2px;
            font-weight: 300;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 3em;
            font-weight: 300;
            letter-spacing: 2px;
            color: #fff;
        }

        .section {
            margin-bottom: 80px;
        }

        h2 {
            font-size: 1.5em;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 30px;
            color: #d4af37;
            border-left: 2px solid #d4af37;
            padding-left: 20px;
        }

        p {
            color: #ccc;
            font-size: 1.05em;
            font-weight: 300;
            margin-bottom: 20px;
        }

        ul, ol {
            color: #ccc;
            font-size: 1.05em;
            font-weight: 300;
            margin-left: 40px;
            margin-bottom: 20px;
        }

        li {
            margin-bottom: 10px;
        }

        code {
            background: #111;
            color: #d4af37;
            padding: 2px 8px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
        }

        pre {
            background: #111;
            border: 1px solid #222;
            border-radius: 5px;
            padding: 25px;
            overflow-x: auto;
            margin: 30px 0;
        }

        pre code {
            background: none;
            color: #ccc;
            padding: 0;
        }

        a {
            color: #d4af37;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        a:hover {
            color: #fff;
        }

        .divider {
            height: 1px;
            background: #222;
            margin: 60px 0;
        }

        blockquote {
            border-left: 2px solid #333;
            padding-left: 20px;
            margin: 30px 0;
            color: #999;
            font-style: italic;
        }

        .embed-container {
            position: relative;
            width: 100%;
            margin: 30px 0;
            border: 1px solid #333;
            border-radius: 5px;
            overflow: hidden;
        }

        .embed-container iframe {
            width: 100%;
            height: 800px;
            border: none;
            display: block;
        }

        #gameOfLife {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            h2 {
                font-size: 1.2em;
            }

            p, ul, ol {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameOfLife"></canvas>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Projects</a>

        <div class="header">
            <div class="week-number">WEEK 08</div>
            <h1>Networking</h1>
        </div>

        <div class="section">
            <p>This week I collaborated with <a href="https://aaditsaluja.github.io/ps70/" target="_blank">Aadit Saluja</a> on the networking project.</p>
            <div class="embed-container">
                <iframe src="https://aaditsaluja.github.io/ps70/09_networking/index.html" title="Week 9 Networking"></iframe>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameOfLife');
        const ctx = canvas.getContext('2d');
        let width, height, cellSize, cols, rows, grid, nextGrid, hue = 45, zoom = 1;
        const minZoom = 0.5, maxZoom = 3;
        let gradientAngle = 0, gradientOffsetX = 0, gradientOffsetY = 0, patternPhase = 0;
        function initCanvas() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; cellSize = Math.floor(10 * zoom); cols = Math.floor(width / cellSize); rows = Math.floor(height / cellSize); grid = createGrid(); nextGrid = createGrid(); randomizeGrid(); }
        function createGrid() { return new Array(cols).fill(null).map(() => new Array(rows).fill(0)); }
        function randomizeGrid() { for (let i = 0; i < cols; i++) { for (let j = 0; j < rows; j++) { grid[i][j] = Math.random() > 0.7 ? 1 : 0; } } }
        function countNeighbors(x, y) { let count = 0; for (let i = -1; i <= 1; i++) { for (let j = -1; j <= 1; j++) { if (i === 0 && j === 0) continue; const col = (x + i + cols) % cols; const row = (y + j + rows) % rows; count += grid[col][row]; } } return count; }
        function updateGrid() { for (let i = 0; i < cols; i++) { for (let j = 0; j < rows; j++) { const neighbors = countNeighbors(i, j); const current = grid[i][j]; if (current === 1 && (neighbors < 2 || neighbors > 3)) { nextGrid[i][j] = 0; } else if (current === 0 && neighbors === 3) { nextGrid[i][j] = 1; } else { nextGrid[i][j] = current; } } } [grid, nextGrid] = [nextGrid, grid]; }
        function drawGrid() { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, width, height); hue = (hue + 1) % 360; gradientAngle += 2; gradientOffsetX += 0.3; gradientOffsetY += 0.2; patternPhase += 0.02; const morphFactor = (Math.sin(patternPhase) + 1) / 2; const centerX = cols / 2; const centerY = rows / 2; for (let i = 0; i < cols; i++) { for (let j = 0; j < rows; j++) { if (grid[i][j] === 1) { const angleRad = gradientAngle * Math.PI / 180; const rotatedX = (i + gradientOffsetX) * Math.cos(angleRad) - (j + gradientOffsetY) * Math.sin(angleRad); const rotatedY = (i + gradientOffsetX) * Math.sin(angleRad) + (j + gradientOffsetY) * Math.cos(angleRad); const linearValue = (rotatedX + rotatedY) * 2; const dx = i - centerX; const dy = j - centerY; const distance = Math.sqrt(dx * dx + dy * dy); const circularValue = distance * 3; const gradientValue = linearValue * (1 - morphFactor) + circularValue * morphFactor; const cellHue = (hue + gradientValue) % 360; ctx.fillStyle = `hsl(${cellHue}, 70%, 50%)`; ctx.fillRect(i * cellSize, j * cellSize, cellSize - 1, cellSize - 1); } } } }
        function handleZoom(delta) { const oldZoom = zoom; zoom *= delta > 0 ? 1.1 : 0.9; zoom = Math.max(minZoom, Math.min(maxZoom, zoom)); if (oldZoom !== zoom) { cellSize = Math.floor(10 * zoom); const newCols = Math.floor(width / cellSize); const newRows = Math.floor(height / cellSize); if (newCols !== cols || newRows !== rows) { const oldGrid = grid; cols = newCols; rows = newRows; grid = createGrid(); nextGrid = createGrid(); for (let i = 0; i < Math.min(oldGrid.length, cols); i++) { for (let j = 0; j < Math.min(oldGrid[0].length, rows); j++) { grid[i][j] = oldGrid[i][j]; } } } } }
        function animate() { updateGrid(); drawGrid(); setTimeout(() => requestAnimationFrame(animate), 200); }
        initCanvas(); animate();
        canvas.addEventListener('wheel', (e) => { e.preventDefault(); handleZoom(e.deltaY); }, { passive: false });
        let lastTouchDistance = 0;
        canvas.addEventListener('touchstart', (e) => { if (e.touches.length === 2) { const dx = e.touches[0].clientX - e.touches[1].clientX; const dy = e.touches[0].clientY - e.touches[1].clientY; lastTouchDistance = Math.sqrt(dx * dx + dy * dy); } });
        canvas.addEventListener('touchmove', (e) => { if (e.touches.length === 2) { e.preventDefault(); const dx = e.touches[0].clientX - e.touches[1].clientX; const dy = e.touches[0].clientY - e.touches[1].clientY; const distance = Math.sqrt(dx * dx + dy * dy); if (lastTouchDistance > 0) { handleZoom(distance - lastTouchDistance); } lastTouchDistance = distance; } }, { passive: false });
        window.addEventListener('resize', initCanvas);
    </script>
</body>
</html>
